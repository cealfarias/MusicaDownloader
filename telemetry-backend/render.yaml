services:
  - type: web
    name: musicadownloader-telemetry
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ZIP_DOWNLOAD_URL
        value: https://github.com/cealfarias/MusicaDownloader/releases/latest/download/MusicaDownloader-v1.2-Windows.zip
      - key: EXE_DOWNLOAD_URL
        value: https://github.com/cealfarias/MusicaDownloader/releases/latest/download/MusicaDownloader.exe
      - key: DATABASE_URL
        value: postgresql://demiempresa_online_user:qPQ3Dt6qquqpOzRKESgTGf9NjefSeISK@dpg-d9uabv6417fc7383k650-a/demiempresa_online
